# ── pyproject.toml ──
# Single source of truth for package version and dependencies.
# Managed by uv — no wheel build required for deployment.
#
# Usage:
#   uv sync            # create venv + install deps locally
#   uv lock            # regenerate uv.lock
#   uv run pytest      # run tests in the managed venv

[project]
name = "dab-uv-source-example"
version = "0.3.1"                      # <-- bump this for releases
description = "DAB example: uv + pyproject.toml, no wheel build"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"

# Runtime dependencies — installed on the cluster via
# `environment.dependencies: --editable ${workspace.file_path}`
dependencies = [
    "pandas>=2.0",
    "numpy>=1.25",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "databricks-connect>=15.4,<16.0",
    "ipykernel",
]

# ── Build system (hatchling) ──
# Required by PEP 517 / PEP 621 so tools can read metadata,
# but we never actually run `uv build --wheel` for deployment.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Tool configs ──
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
