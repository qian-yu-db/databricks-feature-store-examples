bundle:
  name: ml_lifecycle

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
      profile: DEFAULT

artifacts:
  ml_test:
    type: whl
    build: uv build --wheel

resources:
  jobs:
    train_job:
      name: "[${bundle.target}] train_job"
      tasks:
        - task_key: train
          python_wheel_task:
            package_name: ml_test
            entry_point: train
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - ./dist/*.whl
              - scikit-learn
              - pandas
