[project]
name = "ml_test"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "databricks-connect==16.1",
    "databricks-sdk>=0.40.0",
    "databricks-feature-engineering>=0.8.0",
    "mlflow>=3.3",
    "optuna>=4.4.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.5",
    "pandas>=2.0",
    "requests>=2.31",
    "xgboost",
    "seaborn",
    "ipykernel>=7.2.0",
]

[project.scripts]
train = "ml_test.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_test"]
